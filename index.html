<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>GLB Loader Test</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: #111;
      overflow: hidden;
      height: 100%;
      font-family: monospace;
      color: white;
    }
    #info {
      position: absolute;
      top: 10px;
      left: 10px;
      background: rgba(0,0,0,0.6);
      padding: 8px;
      z-index: 10;
      border-radius: 4px;
    }
    canvas {
      display: block;
    }
  </style>
</head>
<body>
  <div id="info">Loading model...</div>

  <!-- Eruda Console (Debug Tools) -->
  
  <!-- Load Eruda first (not a module) -->
<script>
  const script = document.createElement('script');
  script.src = 'https://cdn.jsdelivr.net/npm/eruda';
  script.onload = () => {
    eruda.init();
    console.log("Eruda loaded and initialized.");
  };
  document.body.appendChild(script);
</script>
  <!-- Three.js App -->
  <script type="module">
    console.log("GLB Loader script running...");

    import * as THREE from 'https://unpkg.com/three@0.161.0/build/three.module.js';
    import { OrbitControls } from 'https://unpkg.com/three@0.161.0/examples/jsm/controls/OrbitControls.js';
    import { GLTFLoader } from 'https://unpkg.com/three@0.161.0/examples/jsm/loaders/GLTFLoader.js';

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x222222);

    const camera = new THREE.PerspectiveCamera(75, innerWidth / innerHeight, 0.1, 1000);
    camera.position.set(0, 1, 3);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(innerWidth, innerHeight);
    document.body.appendChild(renderer.domElement);

    const light = new THREE.HemisphereLight(0xffffff, 0x444444, 1.2);
    scene.add(light);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;

    const loader = new GLTFLoader();
    loader.load(
      'https://threejs.org/examples/models/gltf/DamagedHelmet/glTF/DamagedHelmet.gltf',
      (gltf) => {
        console.log('Model loaded!', gltf);
        const model = gltf.scene;
        model.scale.set(2, 2, 2);
        scene.add(model);
        document.getElementById('info').innerText = "Model loaded successfully!";
      },
      (xhr) => {
        const percent = (xhr.loaded / xhr.total * 100).toFixed(1);
        console.log(`Loading: ${percent}%`);
        document.getElementById('info').innerText = `Loading... ${percent}%`;
      },
      (error) => {
        console.error('Model failed to load:', error);
        document.getElementById('info').innerText = "Model failed to load.";
      }
    );

    window.addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }

    animate();
  </script>
</body>
</html>
